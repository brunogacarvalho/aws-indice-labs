<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Índice de laboratórios práticos em AWS Cloud Computing.">
  <meta name="theme-color" content="#0b1220">
  <title>AWS Labs - Índice de Laboratórios</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="dark">

  <header class="site-header">
    <div class="brand">
      <span class="site-title">AWS Labs - Índice de Laboratórios</span>
      <p class="site-subtitle">Laboratórios práticos do programa AWS re/Start, realizado pela AWS em parceria com a Escola da Nuvem.</p>
    </div>

    <nav class="header-actions">
      <a href="https://github.com/brunogacarvalho/aws-labs"
         target="_blank" rel="noreferrer">Meu GitHub ↗</a>
      <button id="theme-toggle" type="button" aria-label="Alternar tema">
        ☀
      </button>
    </nav>
  </header>

  <main>
    <section id="laboratorios">
      <h1>Laboratórios</h1>

      <div class="filters" id="filters" aria-label="Filtrar por categoria">
        <button class="filter active" data-filter="Todos">Todos</button>
        <button class="filter" data-filter="Computação">Computação</button>
        <button class="filter" data-filter="Rede">Rede</button>
        <button class="filter" data-filter="Segurança">Segurança</button>
        <button class="filter" data-filter="Armazenamento">Armazenamento</button>
        <button class="filter" data-filter="Banco de dados">Banco de dados</button>
        <button class="filter" data-filter="Ferramentas">Ferramentas</button>
        <button class="filter" data-filter="Gerenciamento">Gerenciamento</button>
      </div>

      <div id="lab-list" class="lab-list"></div>
      <p id="empty-state" class="empty-state" hidden>
        Nenhum laboratório encontrado.
      </p>
    </section>

    <section id="extras" class="extra-section">
      <h2>Laboratório extra</h2>
      <div id="extra-list" class="lab-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      Formação: <a href="https://escoladanuvem.org/" target="_blank" rel="noreferrer">Escola da Nuvem</a>
      · Professor Raphael Ohlsen
    </p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
